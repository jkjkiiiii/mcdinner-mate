<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦陪餐搭子 · McDinnerMate</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1e26; --line:#2b2f3a;
    --tx:#e6e8ee; --tx2:#9aa1b2; --amber:#ffce7a; --terra:#e8925c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  header img{width:34px;height:34px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--tx2)}
  #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:78%;padding:11px 15px;border-radius:14px;line-height:1.6;
    font-size:15px;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#2d3346;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .sys{align-self:center;color:var(--tx2);font-size:12px;background:none}
  .card{align-self:flex-start;background:linear-gradient(140deg,#232536,#1c1e2c);
    border:1px solid var(--line);border-radius:14px;padding:14px;max-width:78%}
  .card b{color:var(--amber)}
  footer{border-top:1px solid var(--line);padding:14px 20px;
    display:flex;gap:10px;align-items:center}
  #mic{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:var(--amber);color:#201a0c;font-size:22px;flex-shrink:0;
    transition:.15s}
  #mic.rec{background:var(--terra);color:#fff;transform:scale(1.08)}
  #mic:disabled{opacity:.5;cursor:not-allowed}
  #txt{flex:1;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;color:var(--tx);font-size:15px;outline:none}
  #txt:focus{border-color:var(--amber)}
  audio{display:none}
  .hint{font-size:12px;color:var(--tx2);padding:0 20px 10px}
</style>
</head>
<body>

<header>
  <img src="/static/mascot.svg" alt="">
  <div>
    <h1>麦麦陪餐搭子</h1>
    <div class="sub">一个人吃饭，但不孤单</div>
  </div>
</header>

<div id="log"></div>
<div class="hint" id="hint">按住麦克风说话（松开即发送），也可以直接打字</div>

<footer>
  <button id="mic" title="按住说话">🎙</button>
  <input id="txt" placeholder="今天怎么样？想吃点啥…" autocomplete="off">
</footer>

<audio id="player"></audio>

<script src="/static/app.js"></script>
</body>
</html>
